const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:un(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:un(D.i)},key,un(D.c));
  return new TextDecoder().decode(buf);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let fails=0;
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  if(fails)await new Promise(r=>setTimeout(r,Math.min(fails*2000,20000)));
  const err=document.getElementById('err');err.textContent='';
  if(!crypto.subtle){err.textContent='Navigateur incompatible (HTTPS requis).';return}
  try{
    const html=await open(document.getElementById('pw').value);
    document.open();document.write(html);document.close();
  }catch(x){fails++;err.textContent='Mot de passe incorrect.';document.getElementById('pw').select()}
});
