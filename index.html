<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jeux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@300;400&display=swap">
<style>
  :root { color-scheme: light dark; --bg: #f6f1e7; --ink: #2b1d16; --mute: #7a6a5c; --hair: #ddd2c0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14100e; --ink: #efe5d4; --mute: #a99a8c; --hair: #3d3029; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Cormorant Garamond", Georgia, serif; }
  main { width: min(92vw, 420px); text-align: center; padding: 24px 0; }
  h1 { margin: 0 0 24px; font-weight: 500; font-size: 1.8rem; letter-spacing: .3em; text-transform: uppercase; padding-left: .3em; }
  a { display: block; margin: 0 0 12px; padding: 18px; border: 1px solid var(--hair); color: var(--ink); text-decoration: none; font: 400 .8rem "Jost", sans-serif; letter-spacing: .24em; text-transform: uppercase; transition: background .15s, color .15s; }
  a small { display: block; margin-top: 8px; font: italic 400 1rem "Cormorant Garamond", serif; letter-spacing: 0; text-transform: none; color: var(--mute); }
  a:hover { background: var(--c); border-color: var(--c); color: #fff; }
  a::before { content: ""; display: block; width: 26px; height: 2px; margin: 0 auto 12px; background: var(--c); transition: background .15s; }
  a:hover::before { background: #fff; }
  a:hover small { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Jeux</h1>
  <a style="--c:#f37021" href="echecs/">Échecs<small>Samarcande · professeur et moteur</small></a>
  <a style="--c:#2f6fd6" href="traversal/">Traversée<small>Stratégie 10×10 à relief</small></a>
  <a style="--c:#7b4bb7" href="yinsh/">Yinsh<small>Anneaux et marqueurs réversibles</small></a>
  <a style="--c:#c8342b" href="shogi/">Shogi<small>Les échecs japonais, avec parachutages</small></a>
  <a style="--c:#2e7d4f" href="go/">Go<small>Territoire, pierres noires et blanches</small></a>
</main>
</body>
</html>
